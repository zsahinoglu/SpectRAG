[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrag"
version = "0.2.0.dev0"
description = "SpectRAG: spectral graph retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "faiss-cpu>=1.7.4",
    "networkx>=3.2",
    "pyarrow>=14",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "lxml>=5.0",
    "tiktoken>=0.7",
    "langchain-text-splitters>=0.3",
    "tenacity>=8.2",
    "spacy>=3.7",
    "langdetect>=1.0.9",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
gliner = ["gliner>=0.2"]                 # pulls in PyTorch
anthropic = ["anthropic>=0.40"]          # also in the default install; kept so the extra name resolves
ollama = ["ollama>=0.2"]
rerank = ["sentence-transformers>=2.7"]  # pulls in PyTorch
dev = [
    "pytest>=8",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "huggingface_hub>=0.23",
    "fastapi>=0.111.0",   # tests/test_server_auth.py
    "httpx>=0.27",
    "uvicorn>=0.30.0",         # server.py imports it at module load
    "python-multipart>=0.0.9", # file-upload routes
]

[tool.setuptools]
py-modules = ["config", "prompts"]

[tool.setuptools.packages.find]
include = ["spectrag*", "rag_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
